<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>扫码上传诊断包</title>
  <script src="./qrcode.js"></script>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #ffffff;
      --ink: #1c2420;
      --muted: #66716b;
      --line: #e3ece7;
      --brand: #1a9f5c;
      --brand-soft: #e7f6ec;
      --wait-bg: #fff6e5;
      --wait-ink: #8a5a00;
      --fail-bg: #fdeaea;
      --fail-ink: #b42318;
      --shadow: 0 12px 40px rgba(28, 36, 32, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background:
        radial-gradient(1200px 400px at 50% -80px, #d9f3e4 0%, transparent 70%),
        var(--bg);
      color: var(--ink);
    }
    main { max-width: 420px; margin: 0 auto; padding: 28px 20px 40px; }
    .hero { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 18px; }
    .logo {
      flex: 0 0 40px; height: 40px; border-radius: 12px;
      background: var(--brand); color: #fff;
      display: grid; place-items: center;
    }
    h1 { font-size: 20px; line-height: 1.3; margin: 0 0 4px; }
    .hint { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 22px 20px 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      max-width: 100%;
      margin: 0 0 16px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #f3f7f4;
      color: #3d4a44;
      font-size: 13px;
      font-weight: 600;
    }
    .chip::before {
      content: "";
      width: 8px; height: 8px; border-radius: 50%;
      background: #c5d1cb;
    }
    .chip.ready::before { background: var(--brand); }
    .qr {
      display: grid; place-items: center;
      margin: 0 auto 16px;
      padding: 14px;
      width: 268px;
      border-radius: 18px;
      background: #f7faf8;
      border: 1px solid var(--line);
    }
    .qr.hidden { display: none; }
    .qr canvas { display: block; border-radius: 8px; }
    .panel { border-radius: 14px; padding: 16px 14px; }
    .panel.idle { background: #f7faf8; color: var(--muted); }
    .panel.wait { background: var(--wait-bg); color: var(--wait-ink); }
    .panel.ok { background: var(--brand-soft); color: #146c3d; }
    .panel.fail { background: var(--fail-bg); color: var(--fail-ink); }
    .mark {
      width: 44px; height: 44px; margin: 0 auto 10px;
      border-radius: 50%; background: var(--brand); color: #fff;
      display: none; place-items: center;
    }
    .panel.ok .mark { display: grid; }
    .headline { margin: 0; font-size: 16px; font-weight: 700; }
    .sub { margin: 6px 0 0; font-size: 13px; line-height: 1.5; font-weight: 400; opacity: .9; }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div class="logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="7" height="7" rx="1.5" fill="currentColor"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5" fill="currentColor"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5" fill="currentColor"/>
          <rect x="14" y="14" width="3" height="3" fill="currentColor"/>
          <rect x="18" y="14" width="3" height="3" fill="currentColor"/>
          <rect x="14" y="18" width="3" height="3" fill="currentColor"/>
          <rect x="18" y="18" width="3" height="3" fill="currentColor"/>
        </svg>
      </div>
      <div>
        <h1>扫码上传诊断包</h1>
        <p class="hint">在表里点选一条记录，用 debug App 扫码。本页只出码，不展示链接。</p>
      </div>
    </header>
    <section class="card">
      <p id="bugId" class="chip">未选中记录</p>
      <div id="qrWrap" class="qr hidden">
        <canvas id="qr"></canvas>
      </div>
      <div id="panel" class="panel idle">
        <div class="mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M5 12.5l4.2 4.2L19 7.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p id="headline" class="headline">请选择记录</p>
        <p id="sub" class="sub">在表格里点选一行，或打开记录卡片。</p>
      </div>
    </section>
  </main>
  <script type="module">
    import { bitable } from "./lark-base-sdk.js";

    const bugIdEl = document.getElementById("bugId");
    const panelEl = document.getElementById("panel");
    const headlineEl = document.getElementById("headline");
    const subEl = document.getElementById("sub");
    const qrWrap = document.getElementById("qrWrap");
    const fieldMetaCache = new Map();
    let lastLink = "";
    let lastRecordId = "";
    let pollTimer = 0;
    let stopRecordWatch = null;

    function setPanel(kind, title, sub) {
      panelEl.className = "panel " + kind;
      headlineEl.textContent = title;
      subEl.textContent = sub;
    }

    function attachmentName(item) {
      if (item == null) return "";
      if (typeof item === "string") return item;
      return String(item.name || item.fileName || item.text || "");
    }

    function isDiagnosticZip(item) {
      const name = attachmentName(item).toLowerCase();
      if (name === "diagnostic.zip" || name.endsWith(".zip")) return true;
      const mime = String(item && (item.mimeType || item.type) || "").toLowerCase();
      return mime.includes("zip");
    }

    function hasDiagnosticZip(value) {
      if (value == null || value === "") return false;
      const items = Array.isArray(value) ? value : [value];
      return items.some(isDiagnosticZip);
    }

    function attachFeedback(hasZip) {
      if (hasZip) {
        setPanel("ok", "诊断包已上传", "可以关掉本页。");
        qrWrap.classList.add("hidden");
        return;
      }
      setPanel("wait", "等待扫码", "摇一摇 → 上传诊断包 → 扫码。传到「截图」后这里会变成已上传。");
      if (lastLink) qrWrap.classList.remove("hidden");
    }

    function cellText(value) {
      if (value == null || value === "") return "";
      if (Array.isArray(value)) {
        const first = value[0];
        if (first == null) return "";
        if (typeof first === "string") return first;
        return first.text || first.name || String(first.id || "");
      }
      if (typeof value === "object") return value.text || value.name || "";
      return String(value);
    }

    function recordLabel(fields, idByName) {
      return cellText(fields[idByName["Bug 编号"]])
        || cellText(fields[idByName["标题"]])
        || "已选中记录";
    }

    function qrLink(bugId, recordId) {
      const params = new URLSearchParams();
      if (bugId) params.set("bug_id", bugId);
      params.set("record_id", recordId);
      params.set("schema", "1");
      return `dinoenglish://bugreport?${params.toString()}`;
    }

    async function fieldIdByName(table) {
      const cached = fieldMetaCache.get(table.id);
      if (cached) return cached;
      const metas = await table.getFieldMetaList();
      const map = {};
      for (const field of metas) map[field.name] = field.id;
      fieldMetaCache.set(table.id, map);
      return map;
    }

    async function resolveRecordIds() {
      const sel = await bitable.base.getSelection();
      if (sel.recordId) return { tableId: sel.tableId, recordIds: [sel.recordId] };

      const table = sel.tableId
        ? await bitable.base.getTableById(sel.tableId)
        : await bitable.base.getActiveTable();
      const view = sel.viewId
        ? await table.getViewById(sel.viewId)
        : await table.getActiveView();
      const recordIds = typeof view.getSelectedRecordIdList === "function"
        ? await view.getSelectedRecordIdList()
        : [];
      return { tableId: table.id, recordIds: recordIds || [] };
    }

    function stopWatch() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = 0;
      }
      if (typeof stopRecordWatch === "function") {
        stopRecordWatch();
        stopRecordWatch = null;
      }
    }

    async function refreshAttachStatus(table, recordId) {
      const idByName = await fieldIdByName(table);
      const fieldId = idByName["截图"];
      if (!fieldId) {
        setPanel("fail", "当前表没有「截图」字段", "无法判断诊断包是否已上传。");
        qrWrap.classList.add("hidden");
        stopWatch();
        return;
      }
      const record = await table.getRecordById(recordId);
      const found = hasDiagnosticZip(record?.fields?.[fieldId]);
      attachFeedback(found);
      if (found) stopWatch();
    }

    function startWatch(table, recordId) {
      stopWatch();
      refreshAttachStatus(table, recordId).catch((error) => {
        setPanel("fail", "读取失败", error.message || String(error));
      });
      pollTimer = setInterval(() => {
        refreshAttachStatus(table, recordId).catch(() => {});
      }, 2000);
      if (typeof table.onRecordModify === "function") {
        stopRecordWatch = table.onRecordModify(() => {
          refreshAttachStatus(table, recordId).catch(() => {});
        });
      }
    }

    function resetView(title, message) {
      stopWatch();
      lastLink = "";
      lastRecordId = "";
      bugIdEl.textContent = title;
      bugIdEl.classList.remove("ready");
      qrWrap.classList.add("hidden");
      setPanel("idle", title, message);
    }

    async function renderSelected() {
      try {
        const { tableId, recordIds } = await resolveRecordIds();
        if (!recordIds.length) {
          resetView("未选中记录", "在表格里点选一行，或打开记录卡片。");
          return;
        }
        if (recordIds.length > 1) {
          resetView("选中了 " + recordIds.length + " 条", "请只选一条，再扫码。");
          return;
        }

        const recordId = recordIds[0];
        const table = tableId
          ? await bitable.base.getTableById(tableId)
          : await bitable.base.getActiveTable();

        if (recordId === lastRecordId && lastLink) {
          await refreshAttachStatus(table, recordId);
          return;
        }

        const idByName = await fieldIdByName(table);
        const record = await table.getRecordById(recordId);
        const fields = record?.fields || {};
        const bugId = cellText(fields[idByName["Bug 编号"]]);
        const link = qrLink(bugId, recordId);
        lastLink = link;
        lastRecordId = recordId;
        bugIdEl.textContent = recordLabel(fields, idByName);
        bugIdEl.classList.add("ready");
        await QRCode.toCanvas(document.getElementById("qr"), link, { width: 240, margin: 1 });
        attachFeedback(hasDiagnosticZip(fields[idByName["截图"]]));
        startWatch(table, recordId);
      } catch (error) {
        resetView("读取失败", error.message || String(error));
      }
    }

    bitable.base.onSelectionChange(() => {
      renderSelected();
    });
    renderSelected();
  </script>
</body>
</html>
