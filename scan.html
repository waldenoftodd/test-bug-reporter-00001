<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>扫码上传诊断包</title>
  <script src="./qrcode.js"></script>
  <style>
    :root {
      --bg: #e8f3ec;
      --card: #ffffff;
      --ink: #15241c;
      --muted: #5f6f66;
      --line: #dce8e1;
      --brand: #16a34a;
      --brand-soft: #e8f8ee;
      --wait-bg: #fff7e8;
      --wait-ink: #9a6700;
      --fail-bg: #fdeaea;
      --fail-ink: #b42318;
      --shadow: 0 16px 48px rgba(21, 36, 28, .08);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background:
        radial-gradient(900px 380px at 50% -120px, #ccefdc 0%, transparent 70%),
        var(--bg);
      color: var(--ink);
    }
    main {
      width: min(520px, 100%);
      min-height: 100%;
      margin: 0 auto;
      padding: 20px 16px 24px;
      display: flex;
      flex-direction: column;
    }
    .hero {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }
    .logo {
      flex: 0 0 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(180deg, #22c55e, var(--brand));
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 18px rgba(22, 163, 74, .28);
    }
    .build { margin: 8px 0 0; font-size: 11px; color: #9aa59e; letter-spacing: .08em; }
    h1 {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.4;
      margin: 0 0 6px;
      letter-spacing: .06em;
    }
    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.7;
      letter-spacing: .08em;
    }
    .card {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      min-height: 560px;
      padding: 32px 28px;
      background: var(--card);
      border: 1px solid rgba(22, 163, 74, .08);
      border-radius: 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      margin: 0;
      padding: 8px 14px;
      border-radius: 999px;
      background: #f3faf6;
      color: #3d4a44;
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chip.hidden { display: none; }
    .qr {
      display: grid;
      place-items: center;
      width: min(320px, 100%);
      padding: 18px;
      border-radius: 22px;
      background: #f6fbf8;
      border: 1px solid var(--line);
      box-shadow: inset 0 1px 0 #fff;
    }
    .qr.hidden { display: none; }
    .qr canvas { display: block; width: 100%; height: auto; border-radius: 10px; }
    .panel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      min-height: 96px;
      padding: 22px 20px;
      border-radius: 20px;
    }
    .panel-icon {
      position: relative;
      flex: 0 0 40px;
      height: 40px;
      border-radius: 50%;
      display: none;
      place-items: center;
    }
    .panel.ok .panel-icon,
    .panel.wait .panel-icon,
    .panel.fail .panel-icon { display: grid; }
    .panel.idle { background: #f4f8f6; color: var(--muted); }
    .panel.wait { background: var(--wait-bg); color: var(--wait-ink); }
    .panel.ok { background: var(--brand-soft); color: #15803d; }
    .panel.fail { background: var(--fail-bg); color: var(--fail-ink); }
    .panel.wait .panel-icon {
      background: #f5c14a;
      box-shadow: 0 0 0 7px rgba(245, 193, 74, .22);
    }
    .panel.wait .panel-icon::after {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
    }
    .panel.ok .panel-icon { background: var(--brand); }
    .panel.ok .panel-icon::after {
      content: "";
      width: 14px;
      height: 8px;
      margin-top: -3px;
      border-left: 3px solid #fff;
      border-bottom: 3px solid #fff;
      transform: rotate(-45deg);
    }
    .panel.fail .panel-icon { background: var(--fail-ink); }
    .panel.fail .panel-icon::before,
    .panel.fail .panel-icon::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 2.5px;
      background: #fff;
      border-radius: 2px;
    }
    .panel.fail .panel-icon::before { transform: rotate(45deg); }
    .panel.fail .panel-icon::after { transform: rotate(-45deg); }
    .panel-copy { min-width: 0; }
    .headline {
      margin: 0;
      font-size: 18px;
      font-weight: 500;
      line-height: 1.55;
      letter-spacing: .12em;
    }
    .sub {
      margin: 8px 0 0;
      font-size: 14px;
      line-height: 1.75;
      font-weight: 400;
      letter-spacing: .14em;
      opacity: .82;
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="7" height="7" rx="1.5" fill="currentColor"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5" fill="currentColor"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5" fill="currentColor"/>
          <rect x="14" y="14" width="3" height="3" fill="currentColor"/>
          <rect x="18" y="14" width="3" height="3" fill="currentColor"/>
          <rect x="14" y="18" width="3" height="3" fill="currentColor"/>
          <rect x="18" y="18" width="3" height="3" fill="currentColor"/>
        </svg>
      </div>
      <div>
        <h1>扫码上传诊断包</h1>
        <p class="hint">在表里点选一条记录，用 debug App 扫码。</p>
      </div>
    </header>
    <section class="card">
      <p id="bugId" class="chip hidden"></p>
      <div id="qrWrap" class="qr hidden">
        <canvas id="qr"></canvas>
      </div>
      <div id="panel" class="panel idle">
        <span class="panel-icon" aria-hidden="true"></span>
        <div class="panel-copy">
          <p id="headline" class="headline">请选择记录</p>
          <p id="sub" class="sub">在表格里点选一行</p>
        </div>
      </div>
      <p class="build">v20260827a</p>
    </section>
  </main>
  <script type="module">
    import { bitable } from "./lark-base-sdk.js";

    const bugIdEl = document.getElementById("bugId");
    const panelEl = document.getElementById("panel");
    const headlineEl = document.getElementById("headline");
    const subEl = document.getElementById("sub");
    const qrWrap = document.getElementById("qrWrap");
    const fieldMetaCache = new Map();
    let lastLink = "";
    let lastRecordId = "";
    let pollTimer = 0;
    let stopRecordWatch = null;

    function setPanel(kind, title, sub) {
      panelEl.className = "panel " + kind;
      headlineEl.textContent = title;
      subEl.textContent = sub || "";
      subEl.style.display = sub ? "" : "none";
    }

    function attachmentName(item) {
      if (item == null) return "";
      if (typeof item === "string") return item;
      return String(item.name || item.fileName || item.text || "");
    }

    function isDiagnosticZip(item) {
      const name = attachmentName(item).toLowerCase();
      if (name === "diagnostic.zip" || name.endsWith(".zip")) return true;
      const mime = String(item && (item.mimeType || item.type) || "").toLowerCase();
      return mime.includes("zip");
    }

    function hasDiagnosticZip(value) {
      if (value == null || value === "") return false;
      const items = Array.isArray(value) ? value : [value];
      return items.some(isDiagnosticZip);
    }

    function attachFeedback(hasZip) {
      if (hasZip) {
        setPanel("ok", "诊断包已上传", "");
      } else {
        setPanel("wait", "等待扫码", "摇一摇 → 上传诊断包 → 扫码。");
      }
    }

    function setChip(text) {
      if (!text) {
        bugIdEl.textContent = "";
        bugIdEl.classList.add("hidden");
        bugIdEl.classList.remove("ready");
        return;
      }
      bugIdEl.textContent = text;
      bugIdEl.classList.remove("hidden");
      bugIdEl.classList.add("ready");
    }

    function cellText(value) {
      if (value == null || value === "") return "";
      if (Array.isArray(value)) {
        const first = value[0];
        if (first == null) return "";
        if (typeof first === "string") return first;
        return first.text || first.name || String(first.id || "");
      }
      if (typeof value === "object") return value.text || value.name || "";
      return String(value);
    }

    function recordLabel(fields, idByName) {
      const raw = cellText(fields[idByName["问题描述"]])
        || cellText(fields[idByName["标题"]])
        || cellText(fields[idByName["Bug 编号"]]);
      if (!raw) return "";
      const one = raw.replace(/\s+/g, " ").trim();
      return one.length > 36 ? one.slice(0, 36) + "…" : one;
    }

    function qrLink(bugId, recordId) {
      const params = new URLSearchParams();
      if (bugId) params.set("bug_id", bugId);
      params.set("record_id", recordId);
      params.set("schema", "1");
      return `dinoenglish://bugreport?${params.toString()}`;
    }

    async function fieldIdByName(table) {
      const cached = fieldMetaCache.get(table.id);
      if (cached) return cached;
      const metas = await table.getFieldMetaList();
      const map = {};
      for (const field of metas) map[field.name] = field.id;
      fieldMetaCache.set(table.id, map);
      return map;
    }

    async function resolveRecordIds() {
      const sel = await bitable.base.getSelection();
      if (sel.recordId) return { tableId: sel.tableId, recordIds: [sel.recordId] };

      const table = sel.tableId
        ? await bitable.base.getTableById(sel.tableId)
        : await bitable.base.getActiveTable();
      const view = sel.viewId
        ? await table.getViewById(sel.viewId)
        : await table.getActiveView();
      const recordIds = typeof view.getSelectedRecordIdList === "function"
        ? await view.getSelectedRecordIdList()
        : [];
      return { tableId: table.id, recordIds: recordIds || [] };
    }

    function stopWatch() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = 0;
      }
      if (typeof stopRecordWatch === "function") {
        stopRecordWatch();
        stopRecordWatch = null;
      }
    }

    async function refreshAttachStatus(table, recordId) {
      const idByName = await fieldIdByName(table);
      const fieldId = idByName["截图"];
      if (!fieldId) {
        setPanel("fail", "当前表没有「截图」字段", "无法判断诊断包是否已上传。");
        if (lastLink) qrWrap.classList.remove("hidden");
        stopWatch();
        return;
      }
      const record = await table.getRecordById(recordId);
      const found = hasDiagnosticZip(record?.fields?.[fieldId]);
      attachFeedback(found);
      if (found) stopWatch();
    }

    function startWatch(table, recordId) {
      stopWatch();
      refreshAttachStatus(table, recordId).catch((error) => {
        setPanel("fail", "读取失败", error.message || String(error));
      });
      pollTimer = setInterval(() => {
        refreshAttachStatus(table, recordId).catch(() => {});
      }, 2000);
      if (typeof table.onRecordModify === "function") {
        stopRecordWatch = table.onRecordModify(() => {
          refreshAttachStatus(table, recordId).catch(() => {});
        });
      }
    }

    function resetView(title, message) {
      stopWatch();
      lastLink = "";
      lastRecordId = "";
      setChip("");
      qrWrap.classList.add("hidden");
      setPanel("idle", title, message);
    }

    async function renderSelected() {
      try {
        const { tableId, recordIds } = await resolveRecordIds();
        if (!recordIds.length) {
          resetView("未选中记录", "在表格里点选一行");
          return;
        }
        if (recordIds.length > 1) {
          resetView("选中了 " + recordIds.length + " 条", "请只选一条，再扫码。");
          return;
        }

        const recordId = recordIds[0];
        const table = tableId
          ? await bitable.base.getTableById(tableId)
          : await bitable.base.getActiveTable();

        if (recordId === lastRecordId && lastLink) {
          await refreshAttachStatus(table, recordId);
          return;
        }

        const idByName = await fieldIdByName(table);
        const record = await table.getRecordById(recordId);
        const fields = record?.fields || {};
        const bugId = cellText(fields[idByName["Bug 编号"]]);
        const link = qrLink(bugId, recordId);
        lastLink = link;
        lastRecordId = recordId;
        setChip(recordLabel(fields, idByName));
        await QRCode.toCanvas(document.getElementById("qr"), link, { width: 288, margin: 1 });
        qrWrap.classList.remove("hidden");
        attachFeedback(hasDiagnosticZip(fields[idByName["截图"]]));
        startWatch(table, recordId);
      } catch (error) {
        resetView("读取失败", error.message || String(error));
      }
    }

    bitable.base.onSelectionChange(() => {
      renderSelected();
    });
    renderSelected();
  </script>
</body>
</html>
