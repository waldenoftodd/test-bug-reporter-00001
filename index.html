<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Dino Bug 提单</title>
  <script src="./qrcode.js"></script>
  <style>
    :root {
      --bg: #e8f3ec;
      --card: #ffffff;
      --ink: #15241c;
      --muted: #5f6f66;
      --line: #dce8e1;
      --brand: #16a34a;
      --brand-soft: #e8f8ee;
      --wait-ink: #9a6700;
      --fail-ink: #b42318;
      --shadow: 0 16px 48px rgba(21, 36, 28, .08);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background:
        radial-gradient(900px 380px at 50% -120px, #ccefdc 0%, transparent 70%),
        var(--bg);
      color: var(--ink);
    }
    main {
      width: min(520px, 100%);
      min-height: 100%;
      margin: 0 auto;
      padding: 20px 16px 28px;
    }
    .hero {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }
    .logo {
      flex: 0 0 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(180deg, #22c55e, var(--brand));
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 18px rgba(22, 163, 74, .28);
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.4;
      margin: 0;
      letter-spacing: .06em;
    }
    .card {
      padding: 22px 20px 20px;
      background: var(--card);
      border: 1px solid rgba(22, 163, 74, .08);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #3d4a44;
      margin: 14px 0 6px;
    }
    .card > label:first-of-type { margin-top: 0; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    input, select, textarea, button { width: 100%; font: inherit; }
    input, select, textarea {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: #f7fbf8;
      color: var(--ink);
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid rgba(22, 163, 74, .28);
      border-color: var(--brand);
      background: #fff;
    }
    textarea { min-height: 108px; resize: vertical; line-height: 1.55; }
    .combo { position: relative; }
    .combo-field {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f7fbf8;
    }
    .combo-field:focus-within {
      outline: 2px solid rgba(22, 163, 74, .28);
      border-color: var(--brand);
      background: #fff;
    }
    .combo-field input {
      border: 0;
      border-radius: 12px 0 0 12px;
      background: transparent;
      outline: none;
    }
    .combo-toggle {
      flex: 0 0 40px;
      width: 40px;
      margin: 0;
      min-height: 0;
      border: 0;
      border-radius: 0 10px 10px 0;
      background: transparent;
      box-shadow: none;
      color: var(--muted);
      cursor: pointer;
    }
    .combo-toggle:hover { color: var(--brand); }
    .combo-list {
      position: absolute;
      z-index: 8;
      left: 0;
      right: 0;
      top: calc(100% + 6px);
      max-height: 220px;
      overflow: auto;
      margin: 0;
      padding: 6px;
      list-style: none;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
    .combo-list.hidden { display: none; }
    .combo-item {
      display: block;
      width: 100%;
      margin: 0;
      min-height: 36px;
      padding: 8px 10px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      box-shadow: none;
      color: var(--ink);
      font-weight: 500;
      text-align: left;
      cursor: pointer;
    }
    .combo-item:hover, .combo-item.active { background: var(--brand-soft); color: #15803d; }
    button {
      margin-top: 18px;
      min-height: 46px;
      border: 0;
      border-radius: 14px;
      background: var(--brand);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(22, 163, 74, .22);
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .status {
      margin: 14px 0 0;
      font-size: 13px;
      color: var(--wait-ink);
      line-height: 1.6;
      text-align: center;
    }
    .status.ok { color: #15803d; }
    .status.fail { color: var(--fail-ink); }
    .qr {
      display: none;
      margin-top: 16px;
      padding: 18px;
      border-radius: 22px;
      background: #f6fbf8;
      border: 1px solid var(--line);
      text-align: center;
    }
    .qr.show { display: grid; place-items: center; }
    .qr canvas { display: block; width: min(240px, 100%); height: auto; border-radius: 10px; }
    .build { margin: 14px 0 0; font-size: 11px; color: #9aa59e; letter-spacing: .08em; text-align: center; }
    @media (max-width: 420px) {
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <rect x="4" y="3" width="16" height="18" rx="3" stroke="currentColor" stroke-width="2"/>
          <path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>Dino Bug 提单</h1>
    </header>
    <section class="card">
      <label for="desc">问题描述</label>
      <textarea id="desc" maxlength="2000" placeholder="【模块】现象 / 预期 / 实际，可附设备信息"></textarea>
      <div class="row">
        <div>
          <label for="priority">优先级</label>
          <select id="priority">
            <option>P1</option>
            <option>P0</option>
            <option>P2</option>
            <option>P3</option>
          </select>
        </div>
        <div>
          <label for="status">进展状态</label>
          <select id="status">
            <option>待修复</option>
            <option>修复中</option>
            <option>已修复待验证</option>
            <option>待验收</option>
            <option>验收通过，待上线</option>
            <option>上线验证</option>
            <option>已上线</option>
            <option>未修复重新打开</option>
            <option>已关闭</option>
            <option>不是bug</option>
            <option>无法复现</option>
            <option>重复问题</option>
            <option>本期遗留不修</option>
            <option>保持现状</option>
            <option>环境配置问题</option>
            <option>声网问题，已反馈，不卡流程暂时无法修复</option>
          </select>
        </div>
      </div>
      <label for="module">模块</label>
      <div class="combo" id="moduleCombo">
        <div class="combo-field">
          <input id="module" type="text" value="class/课堂" autocomplete="off" placeholder="选择或输入模块" />
          <button class="combo-toggle" id="moduleToggle" type="button" aria-label="打开模块列表">▾</button>
        </div>
        <ul class="combo-list hidden" id="moduleList"></ul>
      </div>
      <div class="row">
        <div>
          <label for="assignee">跟进人</label>
          <select id="assignee">
            <option selected>沈延涛</option>
            <option>魏博源</option>
          </select>
        </div>
        <div>
          <label for="version">版本</label>
          <select id="version">
            <option>v1.5.6</option>
            <option>V1.5.5</option>
            <option>V1.5.4</option>
            <option>v1.5.3</option>
            <option>V1.5.2</option>
            <option>V1.5.1</option>
            <option>V1.5.0</option>
            <option>Daily V2.8.0</option>
            <option>V1.4.2</option>
            <option>V1.4.0</option>
            <option>V1.3.2</option>
            <option>V1.3.0</option>
            <option>V1.2.0</option>
            <option>V1.1.0</option>
            <option>V1.0.0</option>
            <option>管台三期</option>
            <option>管台二期</option>
            <option>管台一期</option>
          </select>
        </div>
      </div>
      <label for="bugType">bug类型</label>
      <select id="bugType">
        <option>人工验证</option>
        <option>AI验证</option>
        <option>闪退/Crash</option>
        <option>Onboarding AB / 接口接入</option>
        <option>B策略 / 主页引导</option>
        <option>CRM外呼AI验证</option>
      </select>
      <label for="note">备注（可选）</label>
      <textarea id="note" maxlength="2000" placeholder="账号、curl、额外上下文"></textarea>
      <button id="submit" type="button">创建并生成二维码</button>
      <p id="statusMsg" class="status"></p>
      <div id="qrWrap" class="qr">
        <canvas id="qr"></canvas>
      </div>
      <p class="build">v20260827d</p>
    </section>
  </main>
  <script type="module">
    import { bitable } from "./lark-base-sdk.js";

    const DEFAULT_MODULES = [
      "class/课堂",
      "log/登录&注册",
      "explore/探索",
      "chat/聊天",
      "me/个人中心",
      "play/游戏",
      "course/一堂好课",
      "member/会员",
      "体验课完成后",
      "onboarding/转化AB",
    ];

    const statusEl = document.getElementById("statusMsg");
    const qrWrap = document.getElementById("qrWrap");
    const moduleInput = document.getElementById("module");
    const moduleList = document.getElementById("moduleList");
    const moduleToggle = document.getElementById("moduleToggle");
    let moduleOptions = DEFAULT_MODULES.slice();

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function qrLink(bugId, recordId) {
      const params = new URLSearchParams();
      if (bugId) params.set("bug_id", bugId);
      params.set("record_id", recordId);
      params.set("schema", "1");
      return `dinoenglish://bugreport?${params.toString()}`;
    }

    async function renderQr(link) {
      await QRCode.toCanvas(document.getElementById("qr"), link, { width: 240, margin: 1 });
      qrWrap.classList.add("show");
    }

    function optionName(item) {
      if (item == null) return "";
      if (typeof item === "string") return item;
      return String(item.name || item.text || "").trim();
    }

    function renderModuleList(filter) {
      const q = (filter || "").trim().toLowerCase();
      const items = moduleOptions.filter((name) => !q || name.toLowerCase().includes(q));
      moduleList.innerHTML = "";
      items.forEach((name) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "combo-item" + (name === moduleInput.value ? " active" : "");
        btn.textContent = name;
        btn.addEventListener("mousedown", (event) => {
          event.preventDefault();
          moduleInput.value = name;
          closeModuleList();
        });
        moduleList.appendChild(btn);
      });
    }

    function openModuleList() {
      renderModuleList(moduleInput.value);
      moduleList.classList.remove("hidden");
    }

    function closeModuleList() {
      moduleList.classList.add("hidden");
    }

    moduleToggle.addEventListener("click", (event) => {
      event.preventDefault();
      if (moduleList.classList.contains("hidden")) openModuleList();
      else closeModuleList();
    });
    moduleInput.addEventListener("focus", openModuleList);
    moduleInput.addEventListener("input", () => openModuleList());
    document.addEventListener("click", (event) => {
      if (!event.target.closest("#moduleCombo")) closeModuleList();
    });

    function metaByName(metas) {
      const map = {};
      for (const field of metas) map[field.name] = field;
      return map;
    }

    function findMeta(metas, names) {
      for (const name of names) {
        if (metas[name]) return metas[name];
      }
      const keys = Object.keys(metas);
      for (const name of names) {
        const hit = keys.find((key) => key.trim() === name);
        if (hit) return metas[hit];
      }
      return undefined;
    }

    function fieldOptions(meta) {
      const raw = meta?.property?.options || meta?.property?.choices || [];
      if (!Array.isArray(raw)) return [];
      return raw.map(optionName).filter(Boolean);
    }

    async function waitBugNumber(table, recordId, metas) {
      const field = metas["Bug 编号"];
      if (!field) return "";
      for (let i = 0; i < 6; i++) {
        if (i) await new Promise((r) => setTimeout(r, 400));
        const record = await table.getRecordById(recordId);
        const value = record?.fields?.[field.id];
        const text = Array.isArray(value) ? (value[0]?.text || value[0] || "") : (value?.text || value || "");
        if (text) return String(text);
      }
      return "";
    }

    function encodeField(meta, value) {
      if (!meta || value == null || value === "") return undefined;
      const type = meta.type;
      const text = Array.isArray(value) ? value.map(String).join(",") : String(value).trim();
      if (!text) return undefined;
      const names = text.split(/[,，]/).map((part) => part.trim()).filter(Boolean);
      const options = fieldOptions(meta);
      const mapped = names.map((name) => {
        const hit = options.find((opt) => opt === name)
          || options.find((opt) => opt.toLowerCase() === name.toLowerCase());
        return hit || name;
      });
      if (type === 4) return mapped;
      if (type === 3) return mapped[0];
      if (type === 11) {
        if (Array.isArray(value)) return value;
        return [{ id: text }];
      }
      if (type === 1) return text;
      return type === 4 ? mapped : (mapped.length > 1 ? mapped.join(",") : mapped[0] || text);
    }

    async function hydrateModuleOptions() {
      try {
        const table = await bitable.base.getActiveTable();
        const metas = metaByName(await table.getFieldMetaList());
        const meta = findMeta(metas, ["模块", "所属模块"]);
        const fromTable = fieldOptions(meta);
        if (fromTable.length) {
          const merged = [];
          fromTable.concat(DEFAULT_MODULES).forEach((name) => {
            if (name && !merged.includes(name)) merged.push(name);
          });
          moduleOptions = merged;
        }
      } catch (_) {}
    }

    async function createInBase(values) {
      const table = await bitable.base.getActiveTable();
      const metas = metaByName(await table.getFieldMetaList());
      if (!findMeta(metas, ["问题描述"])) {
        throw new Error("当前表没有「问题描述」字段。请在「Dino AI-版本问题跟踪」表打开本扩展。");
      }

      let userId = "";
      try {
        userId = await bitable.bridge.getUserId();
      } catch (_) {}

      const fields = {};
      const put = (names, value) => {
        const meta = Array.isArray(names) ? findMeta(metas, names) : metas[names];
        const encoded = encodeField(meta, value);
        if (meta && encoded !== undefined) fields[meta.id] = encoded;
      };
      const putName = (names, name) => {
        const meta = findMeta(metas, names);
        if (!meta || meta.type === 11 || meta.type === 1003) return;
        put(names, name);
      };
      const putUser = (names, id) => {
        const meta = findMeta(metas, names);
        if (!meta || !id || meta.type !== 11) return;
        fields[meta.id] = [{ id }];
      };

      put("问题描述", values.desc);
      put("优先级", values.priority);
      put(["模块", "所属模块"], values.module);
      put("进展状态", values.status);
      put("版本", values.version);
      put("bug类型", values.bugType);
      put("备注", values.note);
      putName(["跟进人"], values.assignee);
      putUser(["提交人"], userId);
      putUser(["反馈人"], userId);
      if (userId) put("提交人 Lark User ID", userId);

      const recordId = await table.addRecord({ fields });
      const bugId = await waitBugNumber(table, recordId, metas);
      return { recordId, bugId };
    }

    document.getElementById("submit").addEventListener("click", async () => {
      const desc = document.getElementById("desc").value.trim();
      if (!desc) { setStatus("请填写问题描述", "fail"); return; }
      const button = document.getElementById("submit");
      button.disabled = true;
      qrWrap.classList.remove("show");
      try {
        setStatus("正在写入…");
        const created = await createInBase({
          desc,
          priority: document.getElementById("priority").value,
          status: document.getElementById("status").value,
          module: moduleInput.value.trim(),
          assignee: document.getElementById("assignee").value.trim(),
          version: document.getElementById("version").value,
          bugType: document.getElementById("bugType").value,
          note: document.getElementById("note").value.trim(),
        });
        await renderQr(qrLink(created.bugId, created.recordId));
        setStatus("已建单，请用 debug App 扫码", "ok");
      } catch (error) {
        setStatus(error.message || String(error), "fail");
      } finally {
        button.disabled = false;
      }
    });

    hydrateModuleOptions();
  </script>
</body>
</html>
