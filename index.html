<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Dino Bug 提单</title>
  <script src="./qrcode.js"></script>
  <style>
    :root {
      --bg: #e8f3ec;
      --card: #ffffff;
      --ink: #15241c;
      --muted: #5f6f66;
      --line: #dce8e1;
      --brand: #16a34a;
      --brand-soft: #e8f8ee;
      --wait-ink: #9a6700;
      --shadow: 0 16px 48px rgba(21, 36, 28, .08);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background:
        radial-gradient(900px 380px at 50% -120px, #ccefdc 0%, transparent 70%),
        var(--bg);
      color: var(--ink);
    }
    main {
      width: min(560px, 100%);
      min-height: 100%;
      margin: 0 auto;
      padding: 20px 16px 28px;
    }
    .hero {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }
    .logo {
      flex: 0 0 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(180deg, #22c55e, var(--brand));
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 18px rgba(22, 163, 74, .28);
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.4;
      margin: 0 0 6px;
      letter-spacing: .06em;
    }
    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.7;
      letter-spacing: .04em;
    }
    .card {
      padding: 24px 22px 22px;
      background: var(--card);
      border: 1px solid rgba(22, 163, 74, .08);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #3d4a44;
      margin: 14px 0 6px;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    input, select, textarea, button { width: 100%; font: inherit; }
    input, select, textarea {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: #f7fbf8;
      color: var(--ink);
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid rgba(22, 163, 74, .28);
      border-color: var(--brand);
      background: #fff;
    }
    textarea { min-height: 120px; resize: vertical; line-height: 1.55; }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 16px 0 4px;
      font-size: 13px;
      color: var(--muted);
    }
    .check input { width: auto; }
    button {
      margin-top: 12px;
      min-height: 46px;
      border: 0;
      border-radius: 14px;
      background: var(--brand);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(22, 163, 74, .22);
    }
    button.secondary {
      background: #3d4a44;
      box-shadow: none;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .status {
      margin: 14px 0 0;
      font-size: 13px;
      color: var(--wait-ink);
      white-space: pre-wrap;
      line-height: 1.6;
    }
    .qr {
      margin-top: 16px;
      padding: 16px;
      border-radius: 22px;
      background: #f6fbf8;
      border: 1px solid var(--line);
      text-align: center;
    }
    .qr canvas { display: block; margin: 0 auto; border-radius: 10px; }
    .payload {
      font-size: 12px;
      word-break: break-all;
      color: var(--muted);
      margin: 10px 0 0;
    }
    .build { margin: 14px 0 0; font-size: 11px; color: #9aa59e; letter-spacing: .08em; text-align: center; }
    @media (max-width: 420px) {
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <rect x="4" y="3" width="16" height="18" rx="3" stroke="currentColor" stroke-width="2"/>
          <path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1>Dino Bug 提单</h1>
        <p class="hint">在「版本问题跟踪」表打开。建单后用 debug App 扫码上传诊断包。</p>
      </div>
    </header>
    <section class="card">
      <label for="desc">问题描述</label>
      <textarea id="desc" maxlength="2000" placeholder="【模块】现象 / 预期 / 实际，可附设备信息"></textarea>
      <div class="row">
        <div>
          <label for="priority">优先级</label>
          <select id="priority">
            <option>P1</option>
            <option>P0</option>
            <option>P2</option>
            <option>P3</option>
          </select>
        </div>
        <div>
          <label for="status">进展状态</label>
          <select id="status">
            <option>待修复</option>
            <option>修复中</option>
            <option>已修复待验证</option>
            <option>待验收</option>
            <option>验收通过，待上线</option>
            <option>上线验证</option>
            <option>已上线</option>
            <option>未修复重新打开</option>
            <option>已关闭</option>
            <option>不是bug</option>
            <option>无法复现</option>
            <option>重复问题</option>
            <option>本期遗留不修</option>
            <option>保持现状</option>
            <option>环境配置问题</option>
            <option>声网问题，已反馈，不卡流程暂时无法修复</option>
          </select>
        </div>
      </div>
      <label for="module">模块</label>
      <select id="module">
        <option>class/课堂</option>
        <option>log/登录&amp;注册</option>
        <option>explore/探索</option>
        <option>chat/聊天</option>
        <option>me/个人中心</option>
        <option>play/游戏</option>
        <option>course/一堂好课</option>
        <option>member/会员</option>
        <option>体验课完成后</option>
        <option>onboarding/转化AB</option>
      </select>
      <div class="row">
        <div>
          <label for="version">版本</label>
          <select id="version">
            <option>v1.5.6</option>
            <option>V1.5.5</option>
            <option>V1.5.4</option>
            <option>v1.5.3</option>
            <option>V1.5.2</option>
            <option>V1.5.1</option>
            <option>V1.5.0</option>
            <option>Daily V2.8.0</option>
            <option>V1.4.2</option>
            <option>V1.4.0</option>
            <option>V1.3.2</option>
            <option>V1.3.0</option>
            <option>V1.2.0</option>
            <option>V1.1.0</option>
            <option>V1.0.0</option>
            <option>管台三期</option>
            <option>管台二期</option>
            <option>管台一期</option>
          </select>
        </div>
        <div>
          <label for="bugType">bug类型</label>
          <select id="bugType">
            <option>人工验证</option>
            <option>AI验证</option>
            <option>闪退/Crash</option>
            <option>Onboarding AB / 接口接入</option>
            <option>B策略 / 主页引导</option>
            <option>CRM外呼AI验证</option>
          </select>
        </div>
      </div>
      <label for="note">备注（可选）</label>
      <textarea id="note" maxlength="2000" placeholder="账号、curl、额外上下文"></textarea>
      <label class="check"><input id="preview" type="checkbox" /> 仅生成预览二维码（不写 Base）</label>
      <button id="submit" type="button">创建并生成二维码</button>
      <button id="copy" class="secondary" type="button">复制扫码链接</button>
      <p id="statusMsg" class="status"></p>
      <div class="qr">
        <canvas id="qr"></canvas>
        <p id="payload" class="payload"></p>
      </div>
      <p class="build">v20260827a</p>
    </section>
  </main>
  <script type="module">
    import { bitable } from "./lark-base-sdk.js";

    const statusEl = document.getElementById("statusMsg");
    const payloadEl = document.getElementById("payload");
    let lastLink = "";

    function uuid() {
      if (crypto.randomUUID) return crypto.randomUUID();
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
        const r = Math.random() * 16 | 0;
        return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
      });
    }

    function setStatus(text) { statusEl.textContent = text; }

    function qrLink(bugId, recordId) {
      const params = new URLSearchParams();
      if (bugId) params.set("bug_id", bugId);
      params.set("record_id", recordId);
      params.set("schema", "1");
      return `dinoenglish://bugreport?${params.toString()}`;
    }

    async function renderQr(link) {
      lastLink = link;
      payloadEl.textContent = link;
      await QRCode.toCanvas(document.getElementById("qr"), link, { width: 240, margin: 1 });
    }

    function metaByName(metas) {
      const map = {};
      for (const field of metas) map[field.name] = field;
      return map;
    }

    async function waitBugNumber(table, recordId, metas) {
      const field = metas["Bug 编号"];
      if (!field) return "";
      for (let i = 0; i < 6; i++) {
        if (i) await new Promise((r) => setTimeout(r, 400));
        const record = await table.getRecordById(recordId);
        const value = record?.fields?.[field.id];
        const text = Array.isArray(value) ? (value[0]?.text || value[0] || "") : (value?.text || value || "");
        if (text) return String(text);
      }
      return "";
    }

    function encodeField(meta, value) {
      if (!meta || value == null || value === "") return undefined;
      const type = meta.type;
      if (type === 4) return Array.isArray(value) ? value : [value];
      if (type === 11) {
        if (Array.isArray(value)) return value;
        return [{ id: value }];
      }
      return value;
    }

    async function createInBase(values) {
      const table = await bitable.base.getActiveTable();
      const metas = metaByName(await table.getFieldMetaList());
      if (!metas["问题描述"]) {
        throw new Error("当前表没有「问题描述」字段。请在「Dino AI-版本问题跟踪」表打开本扩展。");
      }

      let userId = "";
      try {
        userId = await bitable.bridge.getUserId();
      } catch (_) {}

      const fields = {};
      const put = (name, value) => {
        const encoded = encodeField(metas[name], value);
        if (encoded !== undefined) fields[metas[name].id] = encoded;
      };

      put("问题描述", values.desc);
      put("优先级", values.priority);
      put("模块", values.module);
      put("进展状态", values.status);
      put("版本", values.version);
      put("bug类型", values.bugType);
      put("备注", values.note);
      if (userId) put("反馈人", userId);

      const recordId = await table.addRecord({ fields });
      const bugId = await waitBugNumber(table, recordId, metas);
      return { recordId, bugId };
    }

    document.getElementById("submit").addEventListener("click", async () => {
      const desc = document.getElementById("desc").value.trim();
      const preview = document.getElementById("preview").checked;
      if (!desc) { setStatus("请填写问题描述"); return; }
      const button = document.getElementById("submit");
      button.disabled = true;
      try {
        if (preview) {
          const recordId = "recPreview" + uuid().slice(0, 8);
          const link = qrLink("", recordId);
          await renderQr(link);
          setStatus("预览二维码已生成。App 会扫到假 record_id，只有真 Base 记录才能上传成功。");
          return;
        }
        setStatus("正在写入当前问题跟踪表…");
        const created = await createInBase({
          desc,
          priority: document.getElementById("priority").value,
          status: document.getElementById("status").value,
          module: document.getElementById("module").value,
          version: document.getElementById("version").value,
          bugType: document.getElementById("bugType").value,
          note: document.getElementById("note").value.trim(),
        });
        const link = qrLink(created.bugId, created.recordId);
        await renderQr(link);
        setStatus(`已建单\nrecord_id=${created.recordId}\n请用 debug App 摇一摇 → 提 BUG → 扫码。诊断包会写入「截图」。`);
      } catch (error) {
        setStatus(error.message || String(error));
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById("copy").addEventListener("click", async () => {
      if (!lastLink) { setStatus("还没有可复制的链接"); return; }
      await navigator.clipboard.writeText(lastLink);
      setStatus("已复制扫码链接");
    });
  </script>
</body>
</html>
